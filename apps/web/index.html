<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem('color-scheme') ?? 'light';
      } catch {}
    </script>
    <title>Kraya — Unified AI Procurement Workspace for Indian SMBs</title>
    <meta
      name="description"
      content="Prompt-first procurement command center for Indian SMBs: Money Leak Radar, GST 2.0 ITC protection, Credit-Adjusted Landed Cost, and 1-click WhatsApp/PO execution."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141417" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
